<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>战斗轨拖拽预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .dp-blocker {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.28);
      cursor: grabbing; user-select: none; -webkit-user-select: none;
    }
    .dp-ghost {
      position: absolute; border: 2px dashed rgba(0, 240, 255, 0.85);
      background: rgba(0, 240, 255, 0.10); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #7df9ff; font-size: 13px; letter-spacing: 2px;
      text-shadow: 0 0 6px rgba(0, 240, 255, 0.8);
    }
    .dp-hint {
      position: fixed; bottom: 16%; left: 50%; transform: translateX(-50%);
      color: #eee; font-size: 13px; padding: 6px 16px; white-space: nowrap;
      background: rgba(10, 12, 20, 0.85); border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px; pointer-events: none;
    }
  </style>
  <script type="module" crossorigin src="./assets/dragpreview-YPu-Wo3X.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/index-zakNA_E2.js">
</head>
<body>
  <div class="dp-blocker" id="blocker">
    <div class="dp-ghost" id="ghost"><span>先攻条</span></div>
  </div>
  <div class="dp-hint">拖到喜欢的位置松手 · 右键 / Esc 取消</div>
</body>
</html>
