<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>转场演出</title>
<style>
:root{--dur:5800ms}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;cursor:pointer}
.stage.leaving{transition:opacity .35s;opacity:0}
.veil{position:absolute;inset:0;pointer-events:none;z-index:1}

/* ============ 场景背景效果（挂在 .veil 层，只罩背景不罩文字） ============ */
/* 纯黑 */
.bg-black{background:#000}
/* 篝火：底部暖光脉动 */
.bg-campfire{background:radial-gradient(ellipse 80% 55% at 50% 100%, rgba(255,122,20,.62), rgba(150,42,0,.38) 48%, #0a0400 78%)}
.bg-campfire::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:radial-gradient(ellipse 50% 70% at 50% 100%, rgba(255,190,70,.75), rgba(255,110,10,.25) 55%, transparent 75%);animation:fire 1.6s ease-in-out infinite alternate}
@keyframes fire{from{opacity:.6;transform:scaleY(.92)}to{opacity:1;transform:scaleY(1.06)}}
/* 日月轮替：夜空渐亮成晨光 */
.bg-daynight{background:linear-gradient(180deg,#0a0d24 0%,#14204d 55%,#2a4176 100%);animation:daynight var(--dur) linear forwards}
@keyframes daynight{0%{filter:brightness(.7) hue-rotate(0)}55%{filter:brightness(1)}100%{filter:brightness(1.7) hue-rotate(-25deg) saturate(1.4)}}
.bg-daynight .orb{position:absolute;width:110px;height:110px;border-radius:50%;top:18%;animation:orbit var(--dur) linear forwards}
.bg-daynight .orb.moon{left:12%;background:radial-gradient(circle at 38% 35%,#f5f3e8,#b8b4a0 60%,#6a6858);box-shadow:0 0 60px rgba(240,235,210,.5)}
.bg-daynight .orb.sun{right:12%;top:auto;bottom:-140px;background:radial-gradient(circle at 40% 35%,#fff7d0,#ffc93c 55%,#ff7b00);box-shadow:0 0 90px rgba(255,190,60,.7);animation-name:orbit-sun}
@keyframes orbit{from{transform:translateY(0)}to{transform:translateY(-320px);opacity:0}}
@keyframes orbit-sun{from{transform:translateY(0)}to{transform:translateY(-46vh);opacity:1}}
/* 电流：暗蓝底 + 闪电白闪 */
.bg-electric{background:linear-gradient(180deg,#071224,#0c1f3d);animation:zapbg 1.1s steps(2,jump-none) infinite}
@keyframes zapbg{0%,88%{filter:none}90%{filter:brightness(2.6) hue-rotate(180deg)}92%{filter:none}95%{filter:brightness(1.9)}96%{filter:none}}
.bg-electric::after{content:"⚡";position:absolute;top:8%;left:50%;transform:translateX(-50%);font-size:min(30vh,220px);opacity:.3;filter:drop-shadow(0 0 30px #05d9e8)}
/* 尘埃 */
.bg-dust{background:radial-gradient(ellipse at 50% 40%,#2b2010,#0a0602 78%)}
.dust span{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(240,220,170,.6);animation:float linear infinite}
@keyframes float{from{transform:translateY(15vh);opacity:0}12%{opacity:.8}88%{opacity:.6}to{transform:translateY(-110vh);opacity:0}}
/* 雨夜 */
.bg-rain{background:linear-gradient(180deg,#0d1828,#1a2c48)}
.rain span{position:absolute;top:-12%;width:1.5px;height:11vh;background:linear-gradient(transparent,rgba(170,210,255,.65));animation:rainfall linear infinite}
@keyframes rainfall{to{transform:translateY(125vh)}}
/* 星空 */
.bg-stars{background:radial-gradient(ellipse at 50% 120%,#1c2c55,#040814 72%)}
.stars span{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.2}to{opacity:1}}
/* 血色渐晕 */
.bg-blood{background:radial-gradient(ellipse at 50% 50%,#33050d,#050001 82%)}
.bg-blood::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 38%,rgba(200,15,40,.5) 100%);animation:bloodpulse 2.2s ease-in-out infinite}
@keyframes bloodpulse{0%,100%{opacity:.5}50%{opacity:1}}
/* 爆炸闪光 */
.bg-explosion{background:#100500;animation:boomflash var(--dur) ease-out forwards}
@keyframes boomflash{0%{filter:brightness(5) saturate(2)}12%{filter:brightness(2.2) sepia(.8)}40%{filter:brightness(1.15)}100%{filter:brightness(1)}}
.bg-explosion::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,rgba(255,210,90,.95),rgba(255,90,10,.5) 42%,transparent 72%);animation:boomfade var(--dur) ease-out forwards}
@keyframes boomfade{from{opacity:1;transform:scale(.4)}to{opacity:0;transform:scale(1.6)}}

/* ============ 内容区 ============ */
.content{position:relative;z-index:5;text-align:center;padding:0 6vw;max-width:92vw}
.icon{font-size:min(11vh,84px);margin-bottom:2.2vh;filter:drop-shadow(0 0 18px rgba(252,238,10,.45))}
.title{font-weight:bold;line-height:1.25;word-break:break-word;text-shadow:0 2px 24px rgba(0,0,0,.8)}
.sub{margin-top:2.4vh;font-size:min(3.2vh,24px);color:#c8c8d8;opacity:.92;line-height:1.6;word-break:break-word}
.close{position:absolute;top:18px;right:22px;z-index:9;background:none;border:1px solid #444;color:#999;font-size:15px;width:34px;height:34px;border-radius:6px;cursor:pointer;opacity:.55}
.close:hover{opacity:1;border-color:#999}
.retry{position:absolute;inset:0;margin:auto;width:fit-content;height:fit-content;padding:14px 22px;background:#200;border:1px solid #f66;color:#fcc;border-radius:8px;font-size:15px;cursor:pointer}
.sndhint{position:absolute;bottom:4.5vh;left:50%;transform:translateX(-50%);z-index:8;padding:8px 16px;border-radius:20px;background:rgba(20,20,30,.75);border:1px solid #555;color:#ddd;font-size:14px;pointer-events:none;animation:sndpulse 1.6s ease-in-out infinite}
@keyframes sndpulse{0%,100%{opacity:.55}50%{opacity:1}}

/* ============ 25 个文字动画模板 ============ */
/* 进入类：动画跑一遍 */
.a-fade-in{animation:k-fade 1.4s ease-out both}
@keyframes k-fade{from{opacity:0}to{opacity:1}}
.a-rise{animation:k-rise 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes k-rise{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
.a-zoom-in{animation:k-zoom 1s cubic-bezier(.2,1.4,.3,1) both}
@keyframes k-zoom{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
.a-typewriter{overflow:hidden;white-space:nowrap;border-right:3px solid currentColor;animation:k-type 2.2s steps(22) both,k-caret .8s step-end infinite}
@keyframes k-type{from{max-width:0}to{max-width:100%}}
@keyframes k-caret{50%{border-color:transparent}}
.a-letter-pop span{display:inline-block;opacity:0;animation:k-lpop .45s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes k-lpop{from{opacity:0;transform:translateY(26px) scale(.4)}to{opacity:1;transform:none}}
.a-blur-in{animation:k-blur 1.6s ease-out both}
@keyframes k-blur{from{opacity:0;filter:blur(18px)}to{opacity:1;filter:blur(0)}}
.a-spin-in{animation:k-spin 1s cubic-bezier(.3,1.3,.4,1) both}
@keyframes k-spin{from{opacity:0;transform:rotate(-380deg) scale(.3)}to{opacity:1;transform:none}}
.a-flip{animation:k-flip 1.1s ease-out both;backface-visibility:visible}
@keyframes k-flip{from{opacity:0;transform:perspective(600px) rotateX(92deg)}to{opacity:1;transform:perspective(600px) rotateX(0)}}
.a-slide-left{animation:k-sl 1s cubic-bezier(.2,.9,.25,1) both}
@keyframes k-sl{from{opacity:0;transform:translateX(-70vw)}to{opacity:1;transform:none}}
.a-slide-right{animation:k-sr 1s cubic-bezier(.2,.9,.25,1) both}
@keyframes k-sr{from{opacity:0;transform:translateX(70vw)}to{opacity:1;transform:none}}
.a-drop{animation:k-drop .9s cubic-bezier(.3,1.5,.5,1) both}
@keyframes k-drop{from{opacity:0;transform:translateY(-70vh)}70%{opacity:1;transform:translateY(2vh)}to{transform:none}}
.a-tracking{animation:k-track 1.8s ease-out both}
@keyframes k-track{from{opacity:0;letter-spacing:.8em;filter:blur(6px)}to{opacity:1;letter-spacing:.05em;filter:blur(0)}}
.a-blur-slide{animation:k-bs 1.4s ease-out both}
@keyframes k-bs{from{opacity:0;transform:translateX(-14vw) skewX(-18deg);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
.a-flash{animation:k-flashin 1s steps(3) both}
@keyframes k-flashin{0%{opacity:0}30%{opacity:1}45%{opacity:.15}60%{opacity:1}75%{opacity:.3}100%{opacity:1}}
.a-slow-reveal{animation:k-slow 3.6s ease-out both}
@keyframes k-slow{from{opacity:0;transform:scale(.96);filter:blur(4px);letter-spacing:.3em}to{opacity:1;transform:none;filter:blur(0);letter-spacing:.05em}}
.a-split{position:relative}
.a-split::before,.a-split::after{content:attr(data-text);position:absolute;inset:0;opacity:.85}
.a-split::before{color:currentColor;clip-path:inset(0 0 52% 0);animation:k-spltop 1.1s cubic-bezier(.2,.9,.3,1) both}
.a-split::after{color:currentColor;clip-path:inset(48% 0 0 0);animation:k-splbot 1.1s cubic-bezier(.2,.9,.3,1) both}
@keyframes k-spltop{from{transform:translateX(-9vw);opacity:0}to{transform:none;opacity:.85}}
@keyframes k-splbot{from{transform:translateX(9vw);opacity:0}to{transform:none;opacity:.85}}

/* 持续类：整个展示期间循环 */
.a-glitch{position:relative;animation:k-glit .32s steps(2) infinite}
@keyframes k-glit{0%,86%{transform:none;text-shadow:none}88%{transform:translate(-3px,2px);text-shadow:3px 0 #05d9e8,-3px 0 #ff2a6d}92%{transform:translate(3px,-2px);text-shadow:-3px 0 #05d9e8,3px 0 #ff2a6d}96%{transform:none;text-shadow:2px 0 #05d9e8}}
.a-neon-flicker{animation:k-neon 2.4s linear infinite;text-shadow:0 0 8px currentColor,0 0 26px currentColor,0 0 60px currentColor}
@keyframes k-neon{0%,100%{opacity:1}3%{opacity:.4}5%{opacity:1}42%{opacity:1}44%{opacity:.55}46%{opacity:1}78%{opacity:.85}}
.a-swing{animation:k-swing 2.4s ease-in-out infinite;transform-origin:50% -30%}
@keyframes k-swing{0%,100%{transform:rotate(2.5deg)}50%{transform:rotate(-2.5deg)}}
.a-pulse{animation:k-pulse 1.5s ease-in-out infinite}
@keyframes k-pulse{0%,100%{transform:scale(1)}14%{transform:scale(1.06)}28%{transform:scale(1)}42%{transform:scale(1.045)}56%{transform:scale(1)}}
.a-wave span{display:inline-block;animation:k-wave 1.8s ease-in-out infinite}
@keyframes k-wave{0%,100%{transform:translateY(0)}30%{transform:translateY(-.22em)}}
.a-shake{animation:k-shake .5s linear infinite}
@keyframes k-shake{0%,100%{transform:translate(0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
.a-bounce{animation:k-bounce 1.3s cubic-bezier(.3,1.4,.5,1) infinite}
@keyframes k-bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-.35em)}}
.a-shine{background:linear-gradient(100deg,currentColor 38%,#fff 50%,currentColor 62%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:k-shine 2.6s linear infinite}
@keyframes k-shine{from{background-position:200% 0}to{background-position:-20% 0}}
.a-glow{animation:k-glow 2.6s ease-in-out infinite}
@keyframes k-glow{0%,100%{text-shadow:0 0 10px currentColor}50%{text-shadow:0 0 34px currentColor,0 0 70px currentColor}}

/* 减少动态：全部压成淡入 */
.reduced .content .title,.reduced .content .icon{animation:k-fade .8s ease-out both !important}
.reduced .bg-campfire::after,.reduced .bg-electric,.reduced .bg-blood::after{animation:none !important}
</style>
  <script type="module" crossorigin src="./assets/display-GLu4DvVn.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/protocol-BMfyqXpi.js">
  <link rel="modulepreload" crossorigin href="./assets/sfx-BkWiTZ1r.js">
</head>
<body>
<div class="stage bg-black" id="stage">
  <div class="veil" id="veil"></div>
  <div class="content">
    <div class="icon" id="icon"></div>
    <div class="title" id="title"></div>
    <div class="sub" id="sub"></div>
  </div>
  <button class="close" id="close">✕</button>
</div>
</body>
</html>
