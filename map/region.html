<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>区域公路图生成器 | NUSA 2077 GM 工具</title>
<style>
  :root{
    --yellow:#fcee0a; --cyan:#05d9e8; --red:#ff2a6d; --orange:#ff9f1c;
    --bg:#0a0e1a; --panel:#101728; --panel2:#151f36; --line:#243457;
    --text:#dce4f5; --muted:#7d8db0;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--text); font-family:"Microsoft YaHei","PingFang SC",sans-serif; min-height:100vh}
  header{padding:12px 20px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; border-bottom:2px solid var(--cyan); background:linear-gradient(90deg,#0d1322,#101a30)}
  header h1{font-size:18px; color:var(--cyan); letter-spacing:2px}
  header h1 small{font-size:11px; color:var(--muted); font-weight:normal}
  header a{font-size:11px; color:var(--yellow); text-decoration:none; border:1px solid var(--yellow); padding:3px 9px; border-radius:2px; margin-left:auto}
  header a:hover{background:rgba(252,238,10,.12)}
  .bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:10px 20px}
  .bar select{background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:3px; padding:6px 8px; font-size:12px; font-family:inherit; max-width:280px}
  .legchip{font-size:11.5px; padding:5px 10px; cursor:pointer; border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:2px; transition:all .15s}
  .legchip:hover{border-color:var(--cyan)}
  .legchip.on{color:var(--cyan); border-color:var(--cyan); background:#0d1a24; box-shadow:0 0 8px rgba(5,217,232,.25)}
  .btn{font-size:12px; padding:6px 12px; cursor:pointer; border:1px solid var(--yellow); color:var(--yellow); background:transparent; border-radius:3px; transition:all .15s}
  .btn:hover{background:rgba(252,238,10,.12)}
  .btn.c{border-color:var(--cyan); color:var(--cyan)}
  .btn.c:hover{background:rgba(5,217,232,.12)}
  .layout{display:grid; grid-template-columns:1fr 320px; gap:0; align-items:start; padding:0 20px 20px}
  @media (max-width:980px){ .layout{grid-template-columns:1fr} }
  .mapbox{border:1px solid var(--line); background:#05070f; overflow:hidden}
  .mapbox svg{width:100%; display:block}
  aside{background:var(--panel); border:1px solid var(--line); padding:14px; margin-left:12px; position:sticky; top:0; max-height:92vh; overflow-y:auto}
  aside h2{font-size:13px; color:var(--cyan); letter-spacing:2px; margin-bottom:8px; border-bottom:1px dashed var(--line); padding-bottom:7px}
  .ndetail{font-size:12px; line-height:1.8}
  .ndetail h3{font-size:15px; margin-bottom:2px}
  .ndetail .row{display:flex; gap:6px; margin:3px 0}
  .ndetail .k{color:var(--muted); min-width:52px; flex:none}
  .danger-dots span{display:inline-block; width:9px; height:9px; margin-right:3px; border-radius:1px; background:#2a3550}
  .danger-dots span.on{background:var(--red); box-shadow:0 0 5px var(--red)}
  .gm-note{margin-top:8px; padding:8px 10px; background:#0d1424; border-left:3px solid var(--cyan); color:#c9d4ec; font-size:11.5px; line-height:1.8}
  .gm-note b{color:var(--cyan)}
  .nlist{margin-top:12px; border-top:1px dashed var(--line); padding-top:8px; display:flex; flex-direction:column; gap:4px}
  .nli{display:flex; gap:7px; align-items:center; font-size:11.5px; padding:5px 7px; background:var(--panel2); border:1px solid var(--line); border-radius:3px; cursor:pointer}
  .nli:hover{border-color:var(--cyan)}
  .nli .ic{flex:none}
  .nli .tp{margin-left:auto; color:var(--muted); font-size:10px}
  footer{padding:12px 20px; color:var(--muted); font-size:11px; border-top:1px solid var(--line); line-height:1.8}
</style>
</head>
<body>

<header>
  <h1>区域公路图生成器 <small>// 高速 · 国道 · 荒野公路 · 按路段出图</small></h1>
  <a href="index.html">← 返回大地图</a>
</header>

<div class="bar">
  <select id="routeSel"></select>
  <span id="legChips" style="display:flex;gap:6px;flex-wrap:wrap"></span>
  <button class="btn c" id="reroll">🎲 重摇这张图</button>
  <button class="btn" id="exportPng">💾 导出 PNG（枭熊场景用）</button>
</div>

<div class="layout">
  <div class="mapbox">
    <svg id="rmap" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
      <style>
        .hw{fill:none; stroke:#ff9f1c; stroke-width:11; stroke-linecap:round}
        .hwc{fill:none; stroke:#0a0e1a; stroke-width:2; stroke-dasharray:16 14}
        .us{fill:none; stroke:#05d9e8; stroke-width:5; opacity:.85}
        .dirt{fill:none; stroke:#b08050; stroke-width:3; stroke-dasharray:9 8; opacity:.8}
        .nlbl{font-size:19px; fill:#dce4f5; paint-order:stroke; stroke:#05070f; stroke-width:5px; font-weight:bold; font-family:"Microsoft YaHei","PingFang SC",sans-serif}
        .nsub{font-size:12px; fill:#7d8db0; paint-order:stroke; stroke:#05070f; stroke-width:4px; font-family:"Microsoft YaHei","PingFang SC",sans-serif}
        .endpoint{font-size:26px; fill:#fcee0a; paint-order:stroke; stroke:#05070f; stroke-width:6px; font-weight:bold; font-family:"Microsoft YaHei","PingFang SC",sans-serif}
        .km{font-size:12px; fill:#8a99bd; paint-order:stroke; stroke:#05070f; stroke-width:3px; font-family:"Microsoft YaHei","PingFang SC",sans-serif}
        .terr{font-size:21px; fill:#3a4a70; letter-spacing:6px; font-family:"Microsoft YaHei","PingFang SC",sans-serif}
        .fac{font-size:15px; letter-spacing:3px; paint-order:stroke; stroke:#05070f; stroke-width:4px; font-family:"Microsoft YaHei","PingFang SC",sans-serif}
        .node{cursor:pointer}
        .title-t{font-size:30px; fill:#fcee0a; letter-spacing:4px; font-weight:bold; font-family:"Microsoft YaHei","PingFang SC",sans-serif}
        .title-s{font-size:14px; fill:#7d8db0; letter-spacing:2px; font-family:"Microsoft YaHei","PingFang SC",sans-serif}
        .leg-t{font-size:12px; fill:#7d8db0; font-family:"Microsoft YaHei","PingFang SC",sans-serif}
      </style>
    </svg>
  </div>
  <aside>
    <h2>节点详情</h2>
    <div class="ndetail" id="ndetail"><p style="color:var(--muted)">点地图上的节点看 GM 注释。</p></div>
    <div class="nlist" id="nlist"></div>
  </aside>
</div>

<footer>
  示意图为程序生成的<b>相对位置图</b>（非真实比例地图）：高速/国道/荒野公路三级路网 + 沿途节点，供跑团时对照使用。同一路段同一种子出同一张图，可重摇。<br>
  导出 PNG 后可在枭熊里作为场景背景上传，配合大地图（<a href="index.html" style="color:var(--cyan)">index.html</a>）使用。
</footer>

<script>
// ================= 数据（与大地图同源的关键字段子集） =================
const FACTION = {

const CITIES = {

  minneapolis:{ n:"明尼阿波利斯", f:"nusa", d:2, ll:[45.0,-93.3] },
  chicago:    { n:"芝加哥", f:"nusa", d:5, ll:[41.9,-87.6] },

  pittsburgh: { n:"匹兹堡", f:"nusa", d:2, ll:[40.4,-80.0] },
  boston:     { n:"波士顿", f:"nusa", d:2, ll:[42.4,-71.1] },
  nyc:        { n:"纽约", f:"nusa", d:3, ll:[40.7,-74.0] },
  dc:         { n:"华盛顿", f:"nusa", d:2, ll:[38.9,-77.0] },
  atlanta:    { n:"亚特兰大", f:"nusa", d:3, ll:[33.75,-84.4] },
  nashville:  { n:"纳什维尔", f:"nusa", d:2, ll:[36.2,-86.8] },
  memphis:    { n:"孟菲斯", f:"nusa", d:3, ll:[35.1,-90.0] },
  neworleans: { n:"新奥尔良", f:"nusa", d:4, ll:[29.95,-90.1] },
  jacksonville:{ n:"杰克逊维尔", f:"nusa", d:2, ll:[30.3,-81.7] },
  miami:      { n:"迈阿密", f:"nusa", d:4, ll:[25.8,-80.2] },
  dallas:     { n:"达拉斯", f:"texas", d:3, ll:[32.8,-96.8] },
  austin:     { n:"奥斯汀", f:"texas", d:2, ll:[30.3,-97.7] },
  houston:    { n:"休斯顿", f:"texas", d:3, ll:[29.8,-95.4] },
  sanantonio: { n:"圣安东尼奥", f:"texas", d:3, ll:[29.4,-98.5] },
  elpaso:     { n:"埃尔帕索", f:"texas", d:4, ll:[31.8,-106.5] },
};
const ROUTES = [
  { id:"rustbelt", n:"铁锈线", stops:["detroit","chicago","kc","denver","slc","reno","nightcity"] },
  { id:"rustbelt_long", n:"铁锈线·南绕长路版", stops:["detroit","nashville","memphis","neworleans","houston","austin","sanantonio","elpaso","phoenix","la","nightcity"] },
  { id:"i80", n:"I-80 大陆横贯", stops:["chicago","omaha","denver","slc","reno","nightcity"] },
  { id:"i40", n:"I-40 幽灵公路", stops:["nashville","memphis","albuquerque","phoenix","la","nightcity"] },
  { id:"i10", n:"I-10 南线", stops:["jacksonville","neworleans","houston","sanantonio","elpaso","phoenix","la"] },
  { id:"i95", n:"I-95 BosWash 动脉", stops:["boston","nyc","dc","atlanta","jacksonville","miami"] },
  { id:"p101", n:"101 太平洋公路", stops:["seattle","portland","nightcity","la","sandiego"] },
  { id:"i90", n:"I-90 北境线", stops:["seattle","minneapolis","chicago","detroit","pittsburgh","boston"] },
  { id:"texas", n:"德州环线", stops:["dallas","austin","houston","sanantonio","elpaso"] },
];
let customRoutes = [];
try { customRoutes = JSON.parse(localStorage.getItem("nusa_custom_routes") || "[]"); } catch(e) {}

function havKm(a, b){
  const R = 6371, rad = Math.PI/180;
  const [la1, lo1] = CITIES[a].ll, [la2, lo2] = CITIES[b].ll;
  const dLa = (la2-la1)*rad, dLo = (lo2-lo1)*rad;
  const h = Math.sin(dLa/2)**2 + Math.cos(la1*rad)*Math.cos(la2*rad)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const legKm = (a, b) => Math.round(havKm(a, b) * 1.25);
const legDanger = (a, b) => Math.max(CITIES[a].d, CITIES[b].d);

// ================= 种子随机 =================
function hashStr(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ================= 节点素材库 =================
const NODE_TYPES = {
  town:    { ic:"🏘", tp:"小镇",    names:["沉眠镇","锈泉","断轮镇","灰口","新风","尘暴镇","双河","空钟镇","红土镇","望乡"],
             notes:["几十户人家加一个杂货铺。能补给，能打听消息，别惹事——镇上的人彼此都认识。","主街就一条，旅馆老板娘什么都知道，只要你肯先买一晚房。"],
             hook:"小镇今晚有人办丧事/喜事，玩家被卷进去。" },
  gas:     { ic:"⛽", tp:"加油站",  names:["老爹油站","夜鹰油站","红泵","末班油站","孤星油站"],
             notes:["油价看老板心情。后屋一般有点不在货架上的东西卖。","加油免费，洗手间 5eb，问路的咖啡 10eb——2077 年标准公路经济学。"],
             hook:"油站老板收到风声：前面路段出事/有检查站/有埋伏。" },
  motel:   { ic:"🏨", tp:"汽车旅馆", names:["流星汽车旅馆","公路尽头旅馆","霓虹旅馆","候鸟旅馆"],
             notes:["床、热水、以及隔着薄墙听来的别人的故事。","前台不问姓名，只看现金。停在外面的车最好有人守夜。"],
             hook:"隔壁房间的客人半夜敲门求助——或者逃跑。" },
  rest:    { ic:"🅿️", tp:"休息区",  names:["{n} 号休息区"],
             notes:["官方修的，自动贩卖机半数是空的。深夜常有跑同一条线的司机交换路况。","厕所墙上贴着的寻人启事和悬赏令是免费的情报板。"],
             hook:"在休息区捡到/听到下一个路段的关键信息。" },
  check:   { ic:"🚧", tp:"检查站",  names:["{fac}检查站","{fac}边检点","{fac}巡逻卡"],
             notes:["证件扫描+问话。态度取决于你们车上有什么、以及他们今天被扣了多少饷。","可以排队三小时，可以塞钱，可以绕荒野公路——每条路都有价。"],
             hook:"检查站正在找一个和玩家车队特征相似的目标。" },
  ruins:   { ic:"🏚", tp:"废墟",    names:["坠毁的运输舰残骸","废弃购物中心","烧穿的工厂","塌了半边的立交桥","无人小镇遗址"],
             notes:["值得搜，也值得怕。好东西旁边通常住着什么东西。","无人机时代留下的自动防御系统可能还醒着。"],
             hook:"废墟里有值钱货——和一个不想放你们走的住户。" },
  gang:    { ic:"💀", tp:"帮派地盘", names:["秃鹫帮地盘","铁蛇会哨点","公路掠夺者的窝","焦土兄弟会伏击点"],
             notes:["这一段路的「税」归他们收。提前谈好比被拦下谈便宜。","他们认得常客。第一次路过的车队是最好的猎物。"],
             hook:"交过路费、绕路、还是打——本场战斗/谈判的由头。" },
  camp:    { ic:"🔥", tp:"流浪者营地", names:["流浪者营地","游牧家族临时营地","自由车手聚集地"],
             notes:["流浪者对守规矩的过客出乎意料地客气。营地集市能买到修不好的零件。","别带公司标志进场，除非你想试试他们的待客之道。"],
             hook:"营地里有个人认识你们要找的人/去过你们要去的地方。" },
  toll:    { ic:"🎫", tp:"收费站",  names:["收费站","私有路段收费口"],
             notes:["这条路是某公司买下来的，路况意外地好，价格也意外地高。","发票能抵部分关卡的「打点费」——留好。"],
             hook:"收费员随口一句话，暴露这条路最近的异常。" },
  relay:   { ic:"📡", tp:"中继站",  names:["废弃中继站","信号塔 {n}","数据中转点"],
             notes:["网络覆盖的孤岛。黑客玩家可以在这里接入区域网。","有些中继站名义上废弃，实际上还在替谁工作。"],
             hook:"技术检定：从塔里拖出这条路最近 72 小时的通行记录。" },
};
// 节点类型按路段危险度加权
function pickType(rng, danger, road){
  const pool = [];
  const add = (t, w) => { for (let i=0;i<w;i++) pool.push(t); };
  add("town", 3); add("gas", 3); add("motel", 2); add("rest", 2);
  if (road === "hw") { add("toll", 2); add("check", 1 + danger); }
  if (road === "us") { add("check", 1); add("town", 2); }
  if (road === "dirt") { add("ruins", 3); add("camp", 2); }
  if (danger >= 3) { add("gang", danger - 1); add("ruins", 1); }
  if (danger >= 4) { add("gang", 2); }
  add("relay", 1);
  return pool[Math.floor(rng() * pool.length)];
}

// ================= 布局生成 =================
const svg = document.getElementById("rmap");
const NS = "http://www.w3.org/2000/svg";
const W = 1600, H = 1000;
function el(tag, attrs){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

function smoothPath(pts){
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[Math.max(0, i-1)], p1 = pts[i], p2 = pts[i+1], p3 = pts[Math.min(pts.length-1, i+2)];
    const c1 = [p1[0] + (p2[0]-p0[0])/6, p1[1] + (p2[1]-p0[1])/6];
    const c2 = [p2[0] - (p3[0]-p1[0])/6, p2[1] - (p3[1]-p1[1])/6];
    d += ` C ${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}

let roll = 0;      // 重摇计数
let curRoute = null, curLeg = 0;
let nodes = [];    // {x,y,type,name,note,hook,d,road}

function routeById(id){
  return ROUTES.find(r => r.id === id) || customRoutes.find(r => r.id === id);
}
function routeName(r){ return r.n || r.name; }

function genLeg(){
  const r = curRoute;
  const a = r.stops[curLeg], b = r.stops[curLeg + 1];
  const ca = CITIES[a], cb = CITIES[b];
  const danger = legDanger(a, b);
  const km = legKm(a, b);
  const seed = hashStr((r.id) + "|" + curLeg + "|" + roll);
  const rng = mulberry32(seed);

  svg.querySelectorAll(".gen").forEach(e => e.remove());
  nodes = [];
  const g = el("g", { class:"gen" });
  svg.appendChild(g);

  // ---- 背景地形块 ----
  const terrPool = ["枯 死 的 田","荒 原","废 矿 带","盐 滩","红 土 高 原","死 寂 郊 野","辐 射 尘 区"];
  for (let i = 0; i < 3; i++){
    const tx = 200 + rng() * 1100, ty = 160 + rng() * 680;
    g.appendChild(el("ellipse", { cx:tx, cy:ty, rx:160+rng()*220, ry:90+rng()*130, fill:"#0d1526", opacity:.55 }));
    const t = el("text", { class:"terr", x:tx, y:ty, "text-anchor":"middle" });
    t.textContent = terrPool[Math.floor(rng()*terrPool.length)];
    g.appendChild(t);
  }

  // ---- 起终点（左右边缘，高度带随机） ----
  const S = [80, 380 + rng()*240];
  const E = [W-80, 300 + rng()*320];

  // ---- 高速公路主路径 ----
  const midN = 2 + Math.floor(rng()*2);
  const hwPts = [S];
  for (let i = 1; i <= midN; i++){
    hwPts.push([S[0] + (E[0]-S[0]) * i/(midN+1) + (rng()-0.5)*120, 180 + rng()*640]);
  }
  hwPts.push(E);
  const hwPath = el("path", { class:"hw", d:smoothPath(hwPts) });
  g.appendChild(hwPath);
  g.appendChild(el("path", { class:"hwc", d:smoothPath(hwPts) }));

  // ---- 国道：平行偏移 ----
  const off = 90 + rng()*70, dir = rng() > 0.5 ? 1 : -1;
  const usPts = hwPts.map((p, i) => {
    if (i === 0 || i === hwPts.length-1) return [p[0], p[1]];
    return [p[0] + (rng()-0.5)*60, Math.min(H-70, Math.max(70, p[1] + dir*off + (rng()-0.5)*50))];
  });
  g.appendChild(el("path", { class:"us", d:smoothPath(usPts) }));

  // ---- 采样放节点 ----
  const hwLen = hwPath.getTotalLength();
  const hwAt = t => { const p = hwPath.getPointAtLength(hwLen * t); return [p.x, p.y]; };

  const usPathTmp = el("path", { d:smoothPath(usPts) });
  g.appendChild(usPathTmp);
  const usLen = usPathTmp.getTotalLength();
  const usAt = t => { const p = usPathTmp.getPointAtLength(usLen * t); return [p.x, p.y]; };
  usPathTmp.remove();

  function addNode(x, y, road){
    const tkey = pickType(rng, danger, road);
    const t = NODE_TYPES[tkey];
    let nm = t.names[Math.floor(rng()*t.names.length)]
      .replace("{fac}", FACTION[(rng()>0.5? ca.f : cb.f)].n)
      .replace("{n}", 3 + Math.floor(rng()*60));
    const nd = Math.max(1, Math.min(5, danger + (tkey==="gang"||tkey==="ruins" ? 1 : 0) - (tkey==="town"||tkey==="rest" ? 1 : 0) + (rng()>0.8?1:0)));
    nodes.push({ x, y, type:tkey, name:nm, note:t.notes[Math.floor(rng()*t.notes.length)], hook:t.hook, d:nd, road });
  }

  // 高速上 4–6 个节点
  const nHw = 4 + Math.floor(rng()*3);
  for (let i = 1; i <= nHw; i++){
    const t = i/(nHw+1) + (rng()-0.5)*0.06;
    const [x, y] = hwAt(t);
    addNode(x + (rng()-0.5)*30, y - 26 - rng()*10, "hw");
  }
  // 国道上 2–3 个
  const nUs = 2 + Math.floor(rng()*2);
  for (let i = 1; i <= nUs; i++){
    const t = i/(nUs+1) + (rng()-0.5)*0.08;
    const [x, y] = usAt(t);
    addNode(x + (rng()-0.5)*30, y + (dir>0? 30 : -30), "us");
  }
  // 荒野公路：2–3 条岔路，尽头一个节点
  const nDirt = 2 + Math.floor(rng()*2);
  for (let i = 0; i < nDirt; i++){
    const t = 0.2 + rng()*0.6;
    const [bx, by] = hwAt(t);
    const up = rng() > 0.5;
    const ex = Math.min(W-90, Math.max(90, bx + (rng()-0.5)*320));
    const ey = up ? 90 + rng()*120 : H - 90 - rng()*120;
    const bend = [(bx+ex)/2 + (rng()-0.5)*120, (by+ey)/2 + (rng()-0.5)*60];
    g.appendChild(el("path", { class:"dirt", d:`M ${bx} ${by} Q ${bend[0]} ${bend[1]} ${ex} ${ey}` }));
    addNode(ex, ey, "dirt");
  }

  // ---- 里程标注：高速节点间分段 ----
  let acc = 0;
  const segTs = [];
  for (let i = 1; i <= nHw+1; i++) segTs.push(i/(nHw+1));
  for (let i = 0; i < segTs.length-0; i++){
    const t0 = i===0 ? 0.04 : segTs[i-1], t1 = segTs[i] ?? 0.96;
    const [mx, my] = hwAt((t0+t1)/2);
    const seg = Math.round(km/(nHw+1));
    const t = el("text", { class:"km", x:mx, y:my + 30, "text-anchor":"middle" });
    t.textContent = `≈${seg} km`;
    g.appendChild(t);
  }

  // ---- 起终点标记 ----
  for (const [p, c, label] of [[S, ca, "◀ 出发点"], [E, cb, "目的地 ▶"]]){
    g.appendChild(el("circle", { cx:p[0], cy:p[1], r:17, fill:"rgba(0,0,0,.6)" }));
    g.appendChild(el("circle", { cx:p[0], cy:p[1], r:12, fill:FACTION[c.f].c, stroke:"#000", "stroke-width":2 }));
    const t = el("text", { class:"endpoint", x:p[0], y:p[1]-30, "text-anchor":"middle" });
    t.textContent = c.n;
    g.appendChild(t);
    const s = el("text", { class:"nsub", x:p[0], y:p[1]+36, "text-anchor":"middle" });
    s.textContent = FACTION[c.f].n;
    g.appendChild(s);
  }

  // ---- 节点绘制 ----
  for (const nd of nodes){
    const t = NODE_TYPES[nd.type];
    const gg = el("g", { class:"node" });
    gg.appendChild(el("circle", { cx:nd.x, cy:nd.y, r:16, fill:"rgba(0,0,0,.6)" }));
    gg.appendChild(el("circle", { cx:nd.x, cy:nd.y, r:11, fill:"#151f36", stroke: nd.d>=4 ? "#ff2a6d" : "#05d9e8", "stroke-width":2 }));
    const ic = el("text", { x:nd.x, y:nd.y+6, "text-anchor":"middle", style:"font-size:15px" });
    ic.textContent = t.ic;
    gg.appendChild(ic);
    const lb = el("text", { class:"nlbl", x:nd.x, y:nd.y+34, "text-anchor":"middle" });
    lb.textContent = nd.name;
    gg.appendChild(lb);
    gg.addEventListener("click", () => showNode(nd));
    g.appendChild(gg);
  }

  // ---- 标题 / 图例 / 比例注记 ----
  const title = el("text", { class:"title-t", x:40, y:56 });
  title.textContent = `${ca.n} → ${cb.n}`;
  g.appendChild(title);
  const sub = el("text", { class:"title-s", x:40, y:82 });
  sub.textContent = `${routeName(r)} · 第 ${curLeg+1} 段 · 全程约 ${km.toLocaleString()} km · 危险基准 ${"▮".repeat(danger)}${"▯".repeat(5-danger)}`;
  g.appendChild(sub);

  const lg = el("g", {});
  const items = [["#ff9f1c","高速公路"],["#05d9e8","国道"],["#b08050","荒野公路"]];
  items.forEach(([c, n], i) => {
    const y = H - 78 + i*26;
    lg.appendChild(el("line", { x1:44, y1:y, x2:96, y2:y, stroke:c, "stroke-width": i===0?8:(i===1?5:3), "stroke-dasharray": i===2?"8 7":"none" }));
    const t = el("text", { class:"leg-t", x:106, y:y+4 });
    t.textContent = n;
    lg.appendChild(t);
  });
  const sc = el("text", { class:"leg-t", x:W-40, y:H-30, "text-anchor":"end" });
  sc.textContent = "示意图 · 相对位置不代表真实比例 · 种子 " + seed.toString(36);
  lg.appendChild(sc);
  g.appendChild(lg);

  renderNodeList();
}

// ================= 面板 =================
const ndetail = document.getElementById("ndetail");
const nlist = document.getElementById("nlist");
function dots(d){ let s=""; for (let i=1;i<=5;i++) s += `<span class="${i<=d?'on':''}"></span>`; return `<span class="danger-dots">${s}</span>`; }

function showNode(nd){
  const t = NODE_TYPES[nd.type];
  const roadName = { hw:"高速公路", us:"国道", dirt:"荒野公路" }[nd.road];
  ndetail.innerHTML = `
    <h3>${t.ic} ${nd.name}</h3>
    <div class="row"><span class="k">类型</span><span>${t.tp} · 在${roadName}旁</span></div>
    <div class="row"><span class="k">危险</span>${dots(nd.d)}</div>
    <div class="gm-note">${nd.note}<br><b>遭遇钩子：</b>${nd.hook}</div>`;
}

function renderNodeList(){
  nlist.innerHTML = "";
  nodes.forEach((nd) => {
    const t = NODE_TYPES[nd.type];
    const li = document.createElement("div");
    li.className = "nli";
    li.innerHTML = `<span class="ic">${t.ic}</span><span>${nd.name}</span><span class="tp">${t.tp}</span>`;
    li.addEventListener("click", () => showNode(nd));
    nlist.appendChild(li);
  });
}

// ================= 路线/路段选择 =================
const routeSel = document.getElementById("routeSel");
const legChips = document.getElementById("legChips");

function fillRoutes(){
  routeSel.innerHTML = "";
  for (const r of ROUTES){
    const o = document.createElement("option");
    o.value = r.id; o.textContent = r.n;
    routeSel.appendChild(o);
  }
  for (const r of customRoutes){
    const o = document.createElement("option");
    o.value = r.id; o.textContent = "✏️ " + r.name;
    routeSel.appendChild(o);
  }
}

function fillLegs(){
  legChips.innerHTML = "";
  for (let i = 0; i < curRoute.stops.length - 1; i++){
    const a = CITIES[curRoute.stops[i]], b = CITIES[curRoute.stops[i+1]];
    const c = document.createElement("span");
    c.className = "legchip" + (i === curLeg ? " on" : "");
    c.textContent = `${a.n} → ${b.n}`;
    c.addEventListener("click", () => { curLeg = i; fillLegs(); genLeg(); });
    legChips.appendChild(c);
  }
}

routeSel.addEventListener("change", () => {
  curRoute = routeById(routeSel.value); curLeg = 0; roll = 0;
  fillLegs(); genLeg();
});
document.getElementById("reroll").addEventListener("click", () => { roll++; genLeg(); });

// ================= 导出 PNG =================
document.getElementById("exportPng").addEventListener("click", () => {
  const clone = svg.cloneNode(true);
  clone.setAttribute("width", W); clone.setAttribute("height", H);
  // 背景
  const bg = el("rect", { x:0, y:0, width:W, height:H, fill:"#05070f" });
  clone.insertBefore(bg, clone.children[1]);
  const s = new XMLSerializer().serializeToString(clone);
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    cv.getContext("2d").drawImage(img, 0, 0);
    const a = document.createElement("a");
    const ca = CITIES[curRoute.stops[curLeg]], cb = CITIES[curRoute.stops[curLeg+1]];
    a.download = `区域图_${ca.n}-${cb.n}${roll ? "_r"+roll : ""}.png`;
    a.href = cv.toDataURL("image/png");
    a.click();
  };
  img.onerror = () => alert("导出失败：浏览器不支持 SVG 序列化");
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
});

// ================= 启动 =================
fillRoutes();
const hash = location.hash.replace("#", "");
curRoute = routeById(hash) || routeById("rustbelt_long") || ROUTES[0];
routeSel.value = curRoute.id;
fillLegs();
genLeg();
</script>
