<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>载具追逐 · CPR</title>
<style>
:root{
  --bg:#0a0a0c; --panel:#14141a; --panel2:#1b1b23; --line:#2a2a35;
  --txt:#e9e9f0; --dim:#8b8b9c; --yel:#FCEE0A; --cyn:#05d9e8;
  --red:#ff3b30; --grn:#32d74b; --org:#ff9f0a;
  --font:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); font-family:var(--font); font-size:13px;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);
}
.wrap{position:relative;z-index:1;padding:10px 11px 14px}
button,input,select,textarea{font-family:inherit;font-size:12px;color:var(--txt)}
input,select{
  background:#0e0e13;border:1px solid var(--line);border-radius:5px;padding:5px 7px;width:100%;
  outline:none;transition:border-color .15s;
}
input:focus,select:focus{border-color:var(--yel)}
button{
  background:var(--panel2);border:1px solid var(--line);border-radius:5px;
  padding:6px 10px;cursor:pointer;transition:.15s;white-space:nowrap;
}
button:hover:not(:disabled){border-color:var(--yel);color:var(--yel)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--yel);color:#111;border-color:var(--yel);font-weight:600}
button.primary:hover:not(:disabled){background:#fff;border-color:#fff;color:#111}
button.danger:hover:not(:disabled){border-color:var(--red);color:var(--red)}
button.ghost{background:transparent}

/* ===== header ===== */
header{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.logo{
  width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;
  background:linear-gradient(160deg,var(--yel),var(--org));color:#111;
  font-weight:900;font-size:15px;clip-path:polygon(14% 0,100% 0,86% 100%,0 100%);
}
h1{font-size:14px;letter-spacing:.5px;line-height:1.15}
.sub{font-size:10px;color:var(--dim);letter-spacing:.6px}
.pill{
  margin-left:auto;font-size:10px;padding:4px 8px;border-radius:99px;
  border:1px solid var(--line);color:var(--dim);background:var(--panel);
}
.pill.live{border-color:var(--grn);color:var(--grn)}
.pill.over{border-color:var(--red);color:var(--red)}

/* ===== 轨道 ===== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:9px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;color:var(--dim)}
.card-h b{color:var(--txt);font-size:12px}
.card-h .r{margin-left:auto}
.track{position:relative;height:66px;background:#0b0b10;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.track::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px);
}
.lane{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.lane.mid{background:rgba(252,238,10,.28);height:2px}
.slot{position:absolute;top:8px;bottom:8px;width:2px;background:var(--line);transform:translateX(-50%)}
.car{
  position:absolute;top:50%;transform:translate(-50%,-50%);
  min-width:56px;padding:4px 7px;border-radius:6px;font-size:10px;font-weight:700;
  background:var(--c);color:#0a0a0c;border:2px solid #fff3;text-align:center;
  transition:left .45s cubic-bezier(.34,1.4,.64,1),box-shadow .2s;cursor:default;z-index:2;
}
.car small{display:block;font-weight:400;opacity:.75;font-size:9px;white-space:nowrap}
.car.turn{box-shadow:0 0 0 2px var(--yel),0 0 16px rgba(252,238,10,.55);z-index:3}
.car.out{filter:grayscale(1) brightness(.6);text-decoration:line-through}
.car .hp{height:3px;background:#0004;border-radius:2px;margin-top:3px;overflow:hidden}
.car .hp i{display:block;height:100%;background:#0a0a0c;opacity:.55}
.track-car{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:0;z-index:2;transition:left .45s cubic-bezier(.34,1.4,.64,1),top .45s;pointer-events:none}
.track-car .vehicle-svg{width:25px;height:38px;transform:rotate(90deg);filter:drop-shadow(0 2px 3px #000)}
.track-car .vlabel{max-width:72px;margin-top:-3px;padding:1px 4px;border-radius:3px;background:#090a0edb;color:var(--c);font-size:8px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-car.turn{filter:drop-shadow(0 0 5px var(--yel));z-index:3}
.track-car.out{filter:grayscale(1) brightness(.55)}
.track-car.turn .vlabel{box-shadow:0 0 0 1px var(--yel)}
.bands{display:flex;margin-top:5px;gap:2px}
.bands span{flex:1;text-align:center;font-size:8.5px;color:#5a5a6a}

/* ===== 车辆卡 ===== */
.cars{display:flex;flex-direction:column;gap:6px}
.crow{
  display:flex;align-items:center;gap:8px;background:var(--panel2);
  border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;padding:6px 8px;
}
.crow.turn{border-color:var(--yel);box-shadow:0 0 0 1px rgba(252,238,10,.35)}
.crow.out{opacity:.45}
.cname{font-weight:600;font-size:12px;display:flex;align-items:center;gap:5px}
.cmeta{font-size:10px;color:var(--dim);margin-top:1px}
.bar{position:relative;flex:1;min-width:46px;height:5px;background:#000;border-radius:3px;overflow:hidden}
.bar i{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,var(--grn),var(--yel));transition:width .3s}
.bar.low i{background:linear-gradient(90deg,var(--red),var(--org))}
.tag{font-size:9px;padding:2px 5px;border-radius:4px;background:#0006;color:var(--dim);border:1px solid var(--line)}
.tag.on{color:var(--yel);border-color:var(--yel)}
.crow .ctoken{flex:0 0 25px;height:34px;display:grid;place-items:center}
.crow .ctoken .vehicle-svg{width:25px;height:34px;filter:drop-shadow(0 2px 2px #000)}
.cstyle{display:flex;align-items:center;gap:5px;margin-top:5px}
.cstyle select{width:82px;padding:2px 4px;font-size:9px;height:22px}
.cstyle input[type=color]{width:24px;height:22px;padding:1px;cursor:pointer}
.cstyle .tpl{font-size:9px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:125px}
.iconbtn{background:transparent;border:none;color:var(--dim);padding:2px 4px;font-size:13px;line-height:1}
.iconbtn:hover{color:var(--red)}

/* ===== 表单 / 控制 ===== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.field label{display:block;font-size:10px;color:var(--dim);margin-bottom:2px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row>button{flex:0 0 auto}
.mv{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.mv button{text-align:left;padding:5px 7px;font-size:11px;display:flex;justify-content:space-between;gap:6px}
.mv button span{color:var(--dim);font-size:10px}
.mv button:hover span{color:var(--yel)}
.mv button:disabled span{color:var(--dim)}
.mv-row{display:grid;grid-template-columns:1fr 27px;gap:3px;min-width:0}
.mv-row .mv-fail{justify-content:center;padding:5px 0;color:var(--red);border-color:#5a292d;font-weight:700}
.mv-row .mv-fail:hover:not(:disabled){background:#3a171b;border-color:var(--red)}
.log{max-height:170px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;font-size:11px;line-height:1.45}
.log div{padding:4px 6px;border-radius:4px;background:#0e0e13;border-left:2px solid var(--line)}
.log .ok{border-left-color:var(--grn)}
.log .fail{border-left-color:var(--red)}
.log .hit{border-left-color:var(--org);color:#ffd9a0}
.log .round{border-left-color:var(--cyn);color:var(--cyn);background:transparent;font-size:10px;letter-spacing:.5px}
.log .warn{border-left-color:var(--yel)}
.log .sys,.log .info{color:var(--dim)}
.foot{margin-top:8px;font-size:9.5px;color:#5a5a6a;line-height:1.5;text-align:center}
.foot b{color:var(--dim)}
.empty{color:#5a5a6a;font-size:11px;text-align:center;padding:10px 0}
.hint{font-size:10px;color:var(--dim);line-height:1.5;margin-top:6px}
.sep{height:1px;background:var(--line);margin:8px 0}
.badge{font-size:9px;padding:1px 5px;border-radius:3px;background:#0007;border:1px solid var(--line)}
.warnbox{background:#2a1200;border:1px solid var(--org);color:#ffd9a0;border-radius:6px;padding:7px 9px;font-size:11px;margin-bottom:9px;display:none}
.warnbox.show{display:block}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:#2a2a35;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
</style>
  <script type="module" crossorigin src="./assets/main-DgCivYP4.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/protocol-B2lMadWP.js">
  <link rel="modulepreload" crossorigin href="./assets/templates-Bl9B9Bfm.js">
  <link rel="modulepreload" crossorigin href="./assets/vehicle-shapes-DbjJ7Usc.js">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">▶</div>
    <div>
      <h1>载具追逐</h1>
      <div class="sub">CYBERPUNK RED · HOT PURSUIT</div>
    </div>
    <div class="pill" id="phase">未开始</div>
  </header>

  <div class="warnbox" id="warn"></div>

  <!-- 轨道 -->
  <div class="card">
    <div class="card-h">
      <b>追逐轨道</b><span id="bandInfo">—</span>
      <span class="r">第 <b id="round">0</b> 回合</span>
    </div>
    <div class="track" id="track"></div>
    <div class="bands" id="bands"></div>
  </div>

  <!-- 车辆 -->
  <div class="card">
    <div class="card-h"><b>载具</b><span id="carCount">0</span><span class="r" id="turnInfo">—</span></div>
    <div class="cars" id="cars"></div>
    <div class="empty" id="carsEmpty">还没有载具。GM 在下面添加。</div>
  </div>

  <!-- GM 面板 -->
  <div class="card" id="gmAdd" style="display:none">
    <div class="card-h"><b>添加载具</b><span class="r" id="selInfo">未选中 token</span></div>
    <div class="grid2">
      <div class="field"><label>载具名</label><input id="f_name" placeholder="Quadra Type-66" /></div>
      <div class="field"><label>驾驶员</label><input id="f_driver" placeholder="V" /></div>
    </div>
    <div class="grid2" style="margin-top:6px">
      <div class="field"><label>图鉴载具模板</label><select id="f_template"></select></div>
      <div class="field"><label>指示物造型</label><select id="f_kind"></select></div>
    </div>
    <div class="grid3" style="margin-top:6px">
      <div class="field"><label>驾驶技能</label><input id="f_skill" type="number" value="6" min="0" max="20" /></div>
      <div class="field"><label>REF</label><input id="f_ref" type="number" value="8" min="0" max="20" /></div>
      <div class="field"><label>格位</label><input id="f_pos" type="number" value="4" min="1" max="8" /></div>
    </div>
    <div class="grid3" style="margin-top:6px">
      <div class="field"><label>战斗速度</label><select id="f_speed"></select></div>
      <div class="field"><label>SDP</label><input id="f_sdp" type="number" value="60" min="1" /></div>
      <div class="field"><label>颜色</label><input id="f_color" type="color" value="#FCEE0A" style="padding:2px;height:29px" /></div>
    </div>
    <div class="grid3" style="margin-top:6px">
      <div class="field"><label>车道</label>
        <select id="f_lane">
          <option value="-1" selected>自动分配</option>
          <option value="0">车道 1（上）</option>
          <option value="1">车道 2（中）</option>
          <option value="2">车道 3（下）</option>
        </select>
      </div>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="btn_pick" class="ghost">📌 读取选中 token</button>
      <button id="btn_add" class="primary" style="margin-left:auto">+ 加入追逐</button>
    </div>
    <div class="hint">可直接在地图上<strong>右键载具 token → 加入追逐</strong>：优先读取已绑定图鉴，其次按 token 名字匹配。这里读取 token 后，也会把模板与驾驶员数据绑定回 token。</div>
  </div>

  <div class="card" id="gmCtrl" style="display:none">
    <div class="card-h"><b>回合控制</b><span class="r">追逐浮窗</span></div>
    <div id="gmScreen" class="row" style="margin-bottom:8px">
      <button id="btn_screen_open" class="primary">📺 开启追逐屏</button>
      <button id="btn_screen_close" class="ghost">关闭追逐屏</button>
    </div>
    <div class="row" style="margin-bottom:8px">
      <span style="font-size:10px;color:var(--dim)">尺寸</span>
      <button class="ghost" data-size="560,360" title="小窗">紧凑</button>
      <button class="ghost" data-size="760,480" title="标准">标准</button>
      <button class="ghost" data-size="1000,640" title="大窗">大窗</button>
    </div>
    <div class="hint" style="margin-bottom:8px">追逐屏是浮窗：开着时点技能、切地图都不会关掉；拖左上角 ⠿ 移动，拖右下角改大小，⌖ 复位。</div>
    <div id="ctrlSetup" class="row">
      <button id="btn_start" class="primary">🏁 掷先攻 · 开始</button>
      <button id="btn_clear" class="danger">清空</button>
    </div>
    <div id="ctrlRun" style="display:none">
      <div class="field"><label>当前行动</label>
        <div class="row"><select id="f_actor"></select><select id="f_target"></select></div>
      </div>
      <div class="field" style="margin-top:6px"><label>机动动作 · 玩家先自行掷骰，再点结果（GM 可代点）</label>
        <div class="mv" id="mvList"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="btn_endturn" class="primary">下一个 →</button>
        <button id="btn_reset" class="danger" style="margin-left:auto">结束追逐</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><b>战斗日志</b>
      <span class="r"><button id="btn_mute" class="ghost" style="padding:2px 6px">🔊</button></span>
    </div>
    <div class="log" id="log"></div>
  </div>

  <div class="foot">规则依据 <b>CPR DLC《Hot Pursuit》</b> · 8 格 = 8 距离档<br /><span id="ver"></span></div>
</div>
</body>
</html>
