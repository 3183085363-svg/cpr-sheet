<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>追逐屏 · CPR</title>
<style>
:root{
  --bg:#050507; --panel:#121218; --panel2:#1a1a22; --line:#2a2a35;
  --txt:#e9e9f0; --dim:#8b8b9c; --yel:#FCEE0A; --cyn:#05d9e8;
  --red:#ff3b30; --grn:#32d74b; --org:#ff9f0a;
  --font:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}

#topbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;gap:12px;padding:0 18px;background:linear-gradient(180deg,rgba(10,10,14,.96),rgba(10,10,14,.78));border-bottom:1px solid var(--line);z-index:10}
#topbar .ttl{font-size:15px;font-weight:600;letter-spacing:.5px}
#topbar .pill{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
#topbar .pill.live{border-color:var(--grn);color:var(--grn)}
#topbar .pill.over{border-color:var(--red);color:var(--red)}
.views{margin-left:auto;display:flex;gap:6px}
.views button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:5px 13px;font-size:12px;transition:.15s}
.views button:hover:not(.on){border-color:var(--yel);color:var(--yel)}
.views button.on{color:#111;background:var(--yel);border-color:var(--yel);font-weight:600}
#close{background:transparent;border:none;color:var(--dim);font-size:18px;padding:4px 8px;border-radius:6px}
#close:hover{color:var(--red)}

#stage{position:absolute;top:54px;left:0;right:0;bottom:0;overflow:hidden}

#roadView{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 4vw;gap:22px}
.road{position:relative;height:44vh;background:#0b0b10;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.road::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 26px)}
.edge{position:absolute;left:0;right:0;height:2px;background:#3a3a46}
.edge.top{top:24%}
.edge.bot{bottom:24%}
.center{position:absolute;left:0;right:0;top:50%;border-top:3px dashed rgba(252,238,10,.26)}
.ticks{position:absolute;left:0;right:0;bottom:0;display:flex}
.ticks .t{flex:1;text-align:center;font-size:11px;color:var(--dim);border-left:1px solid var(--line);padding:9px 0 11px;background:rgba(0,0,0,.25)}
.ticks .t:last-child{border-right:1px solid var(--line)}
.ticks .t b{display:block;font-size:14px;color:var(--txt);font-weight:600}
.car{position:absolute;transform:translate(-50%,-50%);min-width:72px;padding:5px 9px;border-radius:8px;font-size:12px;font-weight:700;background:var(--c);color:#0a0a0c;border:2px solid rgba(255,255,255,.35);text-align:center;transition:left .5s cubic-bezier(.34,1.4,.64,1),top .5s;z-index:2}
.car small{display:block;font-weight:400;font-size:10px;opacity:.8;white-space:nowrap}
.car .hp{height:4px;background:#0004;border-radius:2px;margin-top:3px;overflow:hidden}
.car .hp i{display:block;height:100%;background:#0a0a0c;opacity:.5}
.car.turn{box-shadow:0 0 0 3px var(--yel),0 0 24px rgba(252,238,10,.6);z-index:3}
.car.out{filter:grayscale(1) brightness(.55)}
.gap{position:absolute;top:50%;transform:translateY(-50%);height:16px;background:rgba(5,217,232,.4);border-radius:8px}
.readout{display:flex;justify-content:center;align-items:baseline;gap:16px}
.readout .big{font-size:clamp(24px,4vw,42px);font-weight:700;color:var(--yel)}
.readout .lbl{font-size:14px;color:var(--dim)}

#hudView{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px}
.hud-dist{font-size:clamp(64px,13vw,160px);font-weight:900;line-height:1;color:var(--yel);letter-spacing:2px;text-align:center}
.hud-dist small{display:block;font-size:16px;font-weight:400;color:var(--dim);letter-spacing:0;margin-top:8px}
.hud-cars{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:920px;width:100%}
.hcard{min-width:230px;flex:1;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:15px 17px}
.hcard.turn{border-color:var(--yel);box-shadow:0 0 0 1px rgba(252,238,10,.4)}
.hcard.out{opacity:.45}
.hcard .n{font-size:16px;font-weight:600}
.hcard .m{font-size:11px;color:var(--dim);margin:4px 0 8px}
.hbar{height:8px;background:#000;border-radius:4px;overflow:hidden}
.hbar i{display:block;height:100%;background:linear-gradient(90deg,var(--grn),var(--yel));transition:width .3s}
.hcard .row2{display:flex;justify-content:space-between;font-size:12px;margin-top:8px}
.hcard .row2 b{color:var(--txt)}

#eventBanner{position:absolute;left:50%;bottom:6vh;transform:translateX(-50%);max-width:80vw;background:#000d;border:1px solid var(--org);color:#ffd9a0;border-radius:10px;padding:12px 24px;font-size:clamp(16px,2.6vw,26px);font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;text-align:center}
#eventBanner.show{opacity:1}
#eventBanner.round{border-color:var(--cyn);color:var(--cyn)}
#eventBanner.fail{border-color:var(--red);color:#ffb3ad}
#eventBanner.sys,#eventBanner.info{color:var(--dim);border-color:var(--line)}

.empty-state{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:16px;text-align:center;padding:20px}
</style>
  <script type="module" crossorigin src="./assets/display-6-BYigyp.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/protocol-hjeExECn.js">
</head>
<body>
<div id="topbar">
  <div class="ttl">载具追逐</div>
  <div class="pill" id="phasePill">未开始</div>
  <div class="views">
    <button id="viewRoad" class="on">公路</button>
    <button id="viewHud">仪表</button>
  </div>
  <button id="close" title="关闭">✕</button>
</div>

<div id="stage">
  <div id="roadView">
    <div class="road" id="road"></div>
    <div class="readout" id="readout"></div>
  </div>
  <div id="hudView"></div>
  <div class="empty-state" id="emptyState">等待 GM 添加载具…</div>
</div>
<div id="eventBanner"></div>

</body>
</html>
